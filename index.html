<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Backlink Control Panel</title>
<style>
/* ---------- Design tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #f4f4f1; --surface-3: #ebebe6;
  --ink: #0b0b0b; --ink-2: #4a4945; --muted: #66655f;
  --line: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-strong: #1c5cab; --accent-ink: #ffffff; --accent-wash: #e6f0fc;
  --good: #0ca30c; --good-ink: #006300; --good-wash: #e7f6e7;
  --warn: #fab219; --warn-ink: #7a4b00; --warn-wash: #fdf3dc;
  --crit: #d03b3b; --crit-ink: #a62727; --crit-wash: #fbe9e9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #898781;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 1px 2px rgba(11,11,11,.06), 0 6px 20px rgba(11,11,11,.05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --surface-3: #2c2c2a;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29a;
    --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-strong: #6da7ec; --accent-ink: #0b0b0b; --accent-wash: #16263a;
    --good-ink: #3dc33d; --good-wash: #12261a; --warn-ink: #fab219; --warn-wash: #2b2210; --crit-ink: #f08a8a; --crit-wash: #2c1515;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --surface-3: #2c2c2a;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29a;
  --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
  --accent: #3987e5; --accent-strong: #6da7ec; --accent-ink: #0b0b0b; --accent-wash: #16263a;
  --good-ink: #3dc33d; --good-wash: #12261a; --warn-ink: #fab219; --warn-wash: #2b2210; --crit-ink: #f08a8a; --crit-wash: #2c1515;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent-strong); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.why { margin: 0 0 12px; padding-left: 18px; font-size: .84rem; color: var(--ink-2); display: grid; gap: 3px; }
.qhead { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.qcard { padding: 16px 18px; display: grid; gap: 12px; }
.qtitle { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qtitle a { font-weight: 650; }
.qprep { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.qtext { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-3); border-radius: 8px; padding: 10px 12px; font-size: .84rem; max-height: 240px; overflow: auto; margin-top: 4px; }
.qrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qrow .input { flex: 1; min-width: 220px; }
.num { font-variant-numeric: tabular-nums; }
svg.icon { width: 1em; height: 1em; flex: none; vertical-align: -0.125em; }

/* ---------- Layout ---------- */
.shell { max-width: 1120px; margin: 0 auto; padding: 0 20px 64px; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; font-size: 1.05rem; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 1.05rem; letter-spacing: -.01em; }
.section-head .muted { font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.sites-grid { align-items: start; }   /* opening one card's fold must not stretch its neighbour */
.grid-stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .9rem; cursor: pointer; transition: background .12s, transform .05s; }
.btn:hover { background: var(--accent-strong); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.secondary:hover { background: var(--surface-3); }
.btn.quiet { background: transparent; color: var(--ink-2); border-color: transparent; min-height: 36px; padding: 0 10px; font-weight: 500; }
.btn.quiet:hover { background: var(--surface-3); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: .82rem; border-radius: 8px; }
.field { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.input, select.input, textarea.input { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:hover { border-color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--crit); }
.hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.error-text { font-size: .8rem; color: var(--crit-ink); margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
.segmented { display: inline-flex; padding: 3px; background: var(--surface-3); border-radius: 10px; gap: 2px; }
.segmented button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: .85rem; cursor: pointer; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--ring), 0 0 0 1px var(--ring); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: .85rem; }
.switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { width: 42px; height: 24px; border-radius: 999px; background: var(--axis); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + .track { background: var(--good); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Chips, status, meters ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .76rem; font-weight: 650; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--good-wash); color: var(--good-ink); }
.chip.warn { background: var(--warn-wash); color: var(--warn-ink); }
.chip.error { background: var(--crit-wash); color: var(--crit-ink); }
.chip.info { background: var(--accent-wash); color: var(--accent-strong); }
.meter { height: 8px; border-radius: 999px; background: var(--accent-wash); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s; }
.meter.warn > span { background: var(--warn); } .meter.crit > span { background: var(--crit); } .meter.good > span { background: var(--good); }
.alert { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid; font-size: .9rem; }
.alert + .alert { margin-top: 10px; }
.alert.error { background: var(--crit-wash); border-color: color-mix(in srgb, var(--crit) 45%, transparent); color: var(--ink); }
.alert.warn { background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.alert.info { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.alert .icon { font-size: 1.15rem; margin-top: 2px; } .alert.error .icon { color: var(--crit-ink); } .alert.warn .icon { color: var(--warn-ink); } .alert.info .icon { color: var(--accent-strong); }
.alert strong { display: block; margin-bottom: 2px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Overview ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.9fr); gap: 16px; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.hero-figure { font-size: 3.6rem; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
.hero-figure small { font-size: 1.4rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.stat { padding: 14px 16px; }
.stat .label { font-size: .78rem; color: var(--muted); font-weight: 600; }
.stat .value { font-size: 1.6rem; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.stat .sub { font-size: .76rem; color: var(--muted); margin-top: 2px; }

/* ---------- Colour dots ---------- */
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
table.data { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.data th, table.data td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
table.data th { font-size: .75rem; color: var(--muted); font-weight: 650; text-transform: none; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }

/* ---------- Site cards ---------- */
.site { padding: 0; overflow: hidden; }
.site-head { padding: 18px 20px 14px; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.site-title { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 650; letter-spacing: -.01em; }
.site-title .swatch { width: 12px; height: 12px; }
.site-url { font-size: .82rem; margin-top: 2px; word-break: break-all; }
.site-body { padding: 0 20px 18px; }
.site-progress { display: grid; gap: 6px; margin-bottom: 14px; }
.site-progress .row { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-bottom: 16px; }
.mini { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; }
@media (max-width: 560px) { .mini-stats { grid-template-columns: repeat(2, 1fr); } .hero-figure { font-size: 3rem; } .shell { padding: 0 14px 56px; } .topbar-inner { padding: 10px 14px; } }
.mini b { display: block; font-size: 1.1rem; letter-spacing: -.01em; }
.mini span { font-size: .72rem; color: var(--muted); font-weight: 600; }
.controls { border-top: 1px solid var(--line); background: var(--surface-2); padding: 16px 20px; display: grid; gap: 14px; }
.controls-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.controls-row > div { min-width: 150px; }
.controls-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
details.fold { border-top: 1px solid var(--line); }
details.fold > summary { list-style: none; cursor: pointer; padding: 12px 20px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .88rem; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { margin-left: auto; transition: transform .15s; color: var(--muted); }
details.fold[open] > summary .chev { transform: rotate(90deg); }
details.fold > .fold-body { padding: 0 20px 16px; }
.issue { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .85rem; }
.issue:first-child { border-top: 0; }
.issue .icon { margin-top: 3px; } .issue.error .icon { color: var(--crit-ink); } .issue.warn .icon { color: var(--warn-ink); }
.issue .why { color: var(--muted); font-size: .8rem; grid-column: 2; }
.issue code { font-family: var(--mono); font-size: .78rem; background: var(--surface-3); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.link-row { display: grid; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .85rem; }
.link-row:first-child { border-top: 0; }
.empty { padding: 18px; text-align: center; color: var(--muted); font-size: .88rem; }
.skeleton { background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Forms, modal, toasts ---------- */
.form-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 22px; }
.modal h2 { font-size: 1.15rem; margin-bottom: 6px; }
.steps { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 10px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-size: .88rem; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
.toast.error { background: var(--crit); color: #fff; }
.log { font: 12px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; max-height: 180px; overflow: auto; }
.footer { margin-top: 40px; font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>Backlink Control Panel</div>
    <span id="conn-pill" class="chip" hidden></span>
    <button class="btn secondary small" id="btn-theme" type="button" aria-label="Change colour theme">Theme: Auto</button>
    <button class="btn secondary small" id="btn-connect" type="button">Connection</button>
    <button class="btn small" id="btn-run" type="button">Run now</button>
  </div>
</header>

<main class="shell" id="main">
  <section id="alerts" aria-live="polite" aria-label="Alerts"></section>
  <section id="overview" aria-labelledby="h-overview"></section>
  <section id="sites-section" aria-labelledby="h-sites"></section>
  <section id="add-section" aria-labelledby="h-add"></section>
  <section id="runs-section" aria-labelledby="h-runs"></section>
  <section id="legacy-section" aria-labelledby="h-legacy"></section>
  <section aria-labelledby="h-log">
    <div class="section-head"><h2 id="h-log">Activity log</h2></div>
    <div class="card pad"><div id="log" class="log" role="log" aria-live="polite">Nothing yet.</div></div>
  </section>
  <p class="footer">Talks straight to your GitHub repository from this browser. Your access token never leaves this device.</p>
</main>

<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- =====================================================================
     LIB: pure functions, no DOM. Tested with node (tests/test_dashboard.py).
     ===================================================================== -->
<script id="lib">
"use strict";

/** Escape text for safe use inside HTML. Every dynamic value goes through this. */
function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/** Only http(s) links are ever rendered as links. */
function safeUrl(url) {
  try { var u = new URL(String(url)); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "#"; } catch (e) { return "#"; }
}

function slugify(text) {
  return String(text || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/https?:\/\//, "").replace(/^www\./, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}

/** A YAML double-quoted scalar. JSON strings are valid YAML, so JSON.stringify gives correct escaping for any text. */
function yq(text) { return JSON.stringify(String(text)); }

function hostOf(url) {
  try { return new URL(url).hostname.toLowerCase(); } catch (e) { return ""; }
}
function bareHost(url) { return hostOf(url).replace(/^www\./, ""); }

/** Lines of "address | what it is" (the part after | is optional) become [{url, about}]. */
function parsePages(text, siteUrl) {
  var out = [];
  String(text || "").split(/\r?\n/).forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var parts = line.split("|");
    var url = parts[0].trim();
    var about = (parts.slice(1).join("|").trim()) || "a page of the site";
    if (url && !/^https?:\/\//i.test(url) && siteUrl) { try { url = new URL(url, siteUrl).href; } catch (e) { /* left as typed, reported by validation */ } }
    out.push({ url: url, about: about });
  });
  return out;
}

function parseFacts(text) {
  return String(text || "").split(/\r?\n/).map(function (l) { return l.replace(/^[-*•]\s*/, "").trim(); }).filter(Boolean);
}

/**
 * Checks the "Add a website" form. Returns {errors: {field: message}, value: normalised form or null}.
 * existingIds: ids already in use (so one site can never overwrite another). existingHosts: web addresses already added.
 */
function validateNewSite(form, existingIds, existingHosts) {
  var errors = {}, name = String(form.name || "").trim(), url = String(form.url || "").trim();
  var description = String(form.description || "").trim().replace(/\s+/g, " ");
  var id = String(form.id || "").trim() || slugify(name || url);
  var facts = parseFacts(form.facts);
  var host = hostOf(url);

  if (name.length < 2 || name.length > 60) errors.name = "Enter the website's name (2 to 60 characters).";
  if (!/^https?:\/\//i.test(url) || host.indexOf(".") < 1) errors.url = "Enter the full web address, for example https://example.com";
  else if ((existingHosts || []).indexOf(bareHost(url)) !== -1) errors.url = "This website is already added. Change its settings in the Websites section instead.";
  if (description.length < 3 || description.length > 120) errors.description = "Describe it in a few words, for example \"a book-request service\" (3 to 120 characters).";
  if (!/^[a-z0-9][a-z0-9-]{1,40}$/.test(id)) errors.id = "Use 2 to 41 lowercase letters, digits or dashes.";
  else if ((existingIds || []).indexOf(id) !== -1) errors.id = "This id is already used by another website.";
  if (facts.length < 3) errors.facts = "Write at least three statements, one per line.";
  else if (facts.length > 12) errors.facts = "Keep it to 12 statements or fewer.";
  else if (facts.some(function (f) { return f.length < 15; })) errors.facts = "Each statement should be a full sentence (at least 15 characters).";
  else if (facts.some(function (f) { return f.length > 400; })) errors.facts = "Each statement should be under 400 characters.";

  var pages = parsePages(form.pages, url);
  if (!pages.length) errors.pages = "Add at least one page an article may link to.";
  else if (pages.length > 12) errors.pages = "Keep it to 12 pages or fewer.";
  else if (pages.some(function (p) { return !/^https?:\/\//i.test(p.url) || bareHost(p.url) !== bareHost(url); })) errors.pages = "Every page must be on this website (" + (bareHost(url) || "its address") + ").";

    await ghPutFile(pub, buildPublishingYaml(v), "Dashboard: add publishing config for " + v.id);
    await saveSettings(v.id, { articles_per_day: v.articlesPerDay, mode: v.mode, enabled: true });
    toast("Added " + v.name + ".");
    showNextSteps(v);
    await load();
  } catch (e) { toast("Could not add the website: " + e.message, "error"); btn.disabled = false; }
}
function showNextSteps(v) {
  openModal('<h2>' + esc(v.name) + ' is added</h2><p class="muted">It starts in review mode.</p><ol class="steps">' +
    '<li><strong>Every day</strong> the machine looks for websites in its niche that clearly accept outside articles and a link back, checks them, and writes an article for each.</li>' +
    '<li><strong>Nothing is sent yet.</strong> Look at what it prepares under Guest posts in the website’s card, then ask Claude to turn sending on.</li>' +
    '<li>The next daily run is at 09:13 UTC, or press Run now.</li></ol>' +
    '<div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end"><button class="btn secondary" data-action="close-modal">Close</button></div>');
}

/* ---------- Runs & legacy ---------- */
function renderRuns() {
  var el = $("#runs-section"), now = new Date();
  var rows = state.runs.slice(0, 8).map(function (r) {
    var level = r.status !== "completed" ? "new" : r.conclusion === "success" ? "ok" : "error", label = r.status !== "completed" ? "Running" : r.conclusion === "success" ? "Succeeded" : (r.conclusion || "Failed");
    var secs = r.run_started_at && r.updated_at ? Math.max(0, Math.round((new Date(r.updated_at) - new Date(r.run_started_at)) / 1000)) : null;
    return "<tr><td>#" + esc(r.run_number) + "</td><td>" + chip(level, label) + "</td><td>" + esc(timeAgo(r.created_at, now)) + '</td><td class="num">' + (secs == null ? "–" : Math.floor(secs / 60) + " min " + (secs % 60) + " s") + "</td><td>" + esc(r.event === "workflow_dispatch" ? "scheduled or manual" : r.event) + '</td><td><a href="' + esc(safeUrl(r.html_url)) + '" target="_blank" rel="noopener noreferrer">Open' + "</a></td></tr>";
  }).join("");
  el.innerHTML = '<div class="section-head"><h2 id="h-runs">Recent runs</h2><span class="muted">a failed run is shown at the top of this page</span></div><div class="card"><div class="table-scroll"><table class="data"><thead><tr><th>Run</th><th>Result</th><th>Started</th><th class="num">Took</th><th>Trigger</th><th></th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="empty">No runs yet.</td></tr>') + "</tbody></table></div></div>";
}
function renderLegacy() {
  var sites = (state.data && state.data.sites) || [];
  $("#legacy-section").innerHTML = '<details class="card" id="legacy"><summary class="pad" style="cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-weight:650"><span id="h-legacy">Email outreach (old system, switched off for every website)</span><span class="chev" style="margin-left:auto">' + icon("chev") + "</span></summary>" +
    '<div class="pad" style="border-top:1px solid var(--line)"><p class="muted" style="margin-bottom:12px">Cold emails to website owners are off. These are the old numbers, kept for history; the records also stop anyone from being emailed twice by the venue campaign.</p>' +
    (sites.length ? '<div class="table-scroll"><table class="data"><thead><tr><th>Website</th><th class="num">Leads found</th><th class="num">Emails sent</th></tr></thead><tbody>' + sites.map(function (s) { var x = s.stats || {}; return "<tr><td>" + esc(s.name || s.id) + '</td><td class="num">' + esc(x.leads_total || 0) + '</td><td class="num">' + esc(x.sent_total || 0) + "</td></tr>"; }).join("") + "</tbody></table></div>" : '<div class="empty">No history.</div>') +
    "</div></details>";
}

/* ---------- Settings ---------- */
async function saveSettings(siteId, changes) {
  for (var attempt = 0; attempt < 2; attempt++) {
    var file = await ghGetFile("config/publishing_settings.json"), doc = file ? JSON.parse(file.content) : { sites: {} };
    var next = mergeSettings(doc, siteId, changes);
    try { var res = await ghPutFile("config/publishing_settings.json", JSON.stringify(next, null, 2) + "\n", "Dashboard: update publishing settings for " + siteId, file ? file.sha : undefined); state.settings = next; state.settingsSha = res.content && res.content.sha; return next; }
    catch (e) { if (attempt === 1 || (e.status !== 409 && e.status !== 422)) throw e; }
  }
}

/* ---------- Guest posts ---------- */
var GUEST_LABEL = { waiting: "Waiting for you", ready: "Prepared", sent: "Sent", published: "Published", not_accepted: "Not accepted" };
function siteName(id) { var s = siteList().filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
function guestList() {
  return guestItems(state.data && state.data.backlink_publishing).map(function (i) { return Object.assign(i, state.guest.local[i.id] || {}); });
}
/** The data the Click-to-submit link carries (it travels in the address after #bl=): used to show the text for copying by hand on a phone. */
function guestPayload(link) {
  try {
    var b = String(link || "").split("#bl=")[1] || ""; if (!b) return null;
    b = b.replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "=";
    var p = JSON.parse(decodeURIComponent(escape(atob(b)))); return p && Array.isArray(p.fields) ? p : null;
  } catch (e) { return null; }
}
var ROLE_LABEL = { first_name: "First name", last_name: "Last name", name: "Name", email: "Email", title: "Title", pitch: "Topics / pitch", article: "Article", bio: "About you / bio", links: "Links", website: "Website", company: "Company", category: "Category" };
function gByHand(i) {
  var p = guestPayload(i.link); if (!p) return "";
  var boxes = p.fields.map(function (f, idx) {
    if (f.kind === "checkbox") return "";
    return '<div><div class="qrow" style="justify-content:space-between"><b style="font-size:.82rem">' + esc(ROLE_LABEL[f.role] || f.role) + '</b><button class="btn quiet small" data-action="g-copy" data-g="' + esc(i.id) + '" data-i="' + idx + '">' + icon("copy") + 'Copy</button></div><div class="qtext">' + esc(String(f.value)) + "</div></div>";
  }).join("");
  var ticks = p.fields.some(function (f) { return f.kind === "checkbox"; });
  return '<details class="fold"><summary>' + icon("chev") + ' On a phone? Copy and paste by hand</summary><div class="fold-body" style="display:grid;gap:10px"><p class="hint">Open the website\u2019s form, paste each piece into the matching box, ' +
    (ticks ? "tick the agreement box, " : "") + "answer any small question, solve the CAPTCHA yourself and press Send. Then tap I sent it.</p>" + boxes +
    '<a class="btn secondary small" href="' + esc(safeUrl(i.form_url)) + '" target="_blank" rel="noopener noreferrer">' + icon("ext") + "Open the website\u2019s form</a></div></details>";
}
function gPublishBox(id) {
  return '<div class="qrow"><label class="visually-hidden" for="g-url-' + id + '">Published address</label><input class="input" type="url" id="g-url-' + id + '" placeholder="When it goes live, paste its address here (https://...)" value="' + esc(state.guest.urls[id] || "") + '">' +
    '<button class="btn small" data-action="g-publish" data-g="' + id + '">Save as published</button></div>';
}
function gCard(i) {
  var id = esc(i.id), action = "";
  var prefilled = i.link && i.link.indexOf("#bl=") < 0;   // a form hosted elsewhere (for example a Google Form) that opens already filled in
  if (i.status === "waiting" && i.link) action = '<div class="qrow"><a class="btn" href="' + esc(safeUrl(i.link)) + '" target="_blank" rel="noopener noreferrer">' + icon("ext") + (prefilled ? "Open the filled form" : "Click to submit") + "</a>" +
    '<button class="btn quiet small" data-action="g-sent" data-g="' + id + '">I sent it</button></div><p class="hint">' + (prefilled ? "The form opens already filled in (no extension needed, works on a phone too). Check it, press Submit, then tap I sent it." :
    "The page opens and fills itself. " + (i.human_check ? "Answer the small question it asks, and tick any CAPTCHA: " : "Tick the CAPTCHA: ") + "it sends by itself as soon as you do (needs the Backlink helper extension in Chrome on a computer).") +
    (i.form_kind === "pitch" ? " This is an application: the editors read the pitch and ask for the article if they like it." : "") + "</p>" + gByHand(i);
  else if (i.status === "sent") action = '<div class="muted">Sent ' + esc(i.sent_on || "") + (i.how ? " (" + esc(i.how) + ")" : "") + ". The editor decides; replies go to the website's email. The system checks the site's sitemap for the article.</div>" + gPublishBox(id);
  else if (i.status === "published") action = '<div class="qrow"><a href="' + esc(safeUrl(i.publication_url)) + '" target="_blank" rel="noopener noreferrer">' + esc(i.publication_url || "") + "</a>" +
    (i.counts_for_seo === true ? chip("ok", "Google can count it") : i.counts_for_seo === false ? chip("warn", "Hidden from Google") : '<span class="muted">The link is checked at the next daily run.</span>') + "</div>";
  else if (i.status === "not_accepted") action = '<div class="muted">' + esc(i.note || "") + "</div>";
  else if (i.status === "ready") action = '<div class="muted">The article is written. It is sent at the next run (or kept back while the website is in review mode).</div>';
  return '<article class="card qcard" aria-label="' + esc(i.domain) + '"><div class="qtitle"><a href="' + esc(safeUrl(i.form_url)) + '" target="_blank" rel="noopener noreferrer">' + esc(i.domain) + "</a>" +
    (i.captcha ? '<span class="chip info">CAPTCHA</span>' : '<span class="chip">No CAPTCHA</span>') + (i.form_kind === "pitch" ? '<span class="chip warn">Pitch first</span>' : "") + (i.relevance != null ? chip("ok", "Fit " + Math.round(i.relevance) + "/10") : "") +
    "</div>" +
    (i.title ? '<div style="font-size:.9rem"><b>Article:</b> ' + esc(i.title) + "</div>" : "") +
    (i.accepts_quote ? '<div class="qtext">Accepts outside articles: \u201c' + esc(i.accepts_quote) + '\u201d\nLinks allowed: \u201c' + esc(i.links_quote || "") + '\u201d</div>' : "") +
    action + "</article>";
}
/** One website's guest posts, as a fold inside its card. It opens by itself while a submission waits for the owner's click. The cards are drawn
    again after every change, so what the owner did here (open or shut, which tab, an address being typed) is remembered in state.guest. */
function guestFold(s) {
  var g = state.guest, items = guestList().filter(function (i) { return i.siteId === s.id; }), counts = guestCounts(items, s.id);
  var tab = g.tab[s.id] || (counts.waiting ? "waiting" : GUEST_TABS.filter(function (k) { return counts[k]; })[0] || "waiting");
  var view = guestView(items, s.id, tab), shown = view.slice(0, g.shown[s.id] || 12);
  var open = g.open[s.id] != null ? g.open[s.id] : counts.waiting > 0;
  var tabs = GUEST_TABS.map(function (k) { return '<button type="button" data-action="g-tab" data-site="' + esc(s.id) + '" data-status="' + k + '" aria-pressed="' + (tab === k) + '">' + GUEST_LABEL[k] + " (" + counts[k] + ")</button>"; }).join("");
  return '<details class="fold" data-guest-site="' + esc(s.id) + '"' + (open ? " open" : "") + "><summary>" + icon("ext") + " Guest posts " +
    (counts.waiting ? chip("warn", counts.waiting + " waiting for you") : '<span class="chip info">' + items.length + "</span>") + '<span class="chev">' + icon("chev") + '</span></summary><div class="fold-body">' +
    '<p class="hint" style="margin:0 0 10px">Websites that clearly accept articles from outside authors and a link back. Without a CAPTCHA the machine sends the form itself. With one, press Click to submit: the form fills itself and sends as soon as you tick the CAPTCHA.</p>' +
    '<div class="segmented" role="group" aria-label="Show" style="margin-bottom:12px;flex-wrap:wrap">' + tabs + "</div>" +
    (shown.length ? '<div style="display:grid;gap:12px">' + shown.map(gCard).join("") + "</div>" :
      '<div class="empty">' + (items.length ? "Nothing here." : "No guest posts yet. Every day the machine looks for websites that accept outside articles in this niche.") + "</div>") +
    (view.length > shown.length ? '<div style="margin-top:12px;text-align:center"><button class="btn secondary" data-action="g-more" data-site="' + esc(s.id) + '">Show ' + Math.min(12, view.length - shown.length) + " more</button></div>" : "") +
    "</div></details>";
}
/** The guest posts live inside each website's card, so drawing them means drawing the cards. */
function renderGuests() { renderSites(); }
async function guestSet(id, change) {
  try {
    if (!state.demo) {
      for (var attempt = 0; attempt < 4; attempt++) {   // someone else (or the daily run) may have just saved it: read it again and retry
        var file = await ghGetFile("state/guestpost_status.json"), doc = file ? JSON.parse(file.content) : {};
        var next = mergeGuestStatus(doc, id, change);
        try { await ghPutFile("state/guestpost_status.json", JSON.stringify(next, null, 1) + "\n", "Dashboard: guest post " + change.status, file ? file.sha : undefined); break; }
        catch (e) { if (attempt === 3 || (e.status !== 409 && e.status !== 422)) throw e; await new Promise(function (r) { setTimeout(r, 800 * (attempt + 1)); }); }
      }
    } else mergeGuestStatus({}, id, change);
    state.guest.local[id] = change.status === "sent" ? { status: "sent", sent_on: new Date().toISOString().slice(0, 10), how: "by you (CAPTCHA)", link: null }
      : { status: "published", publication_url: change.published_url };
    renderGuests();
    toast(change.status === "sent" ? "Recorded as sent." : "Saved. The link is checked at the next daily run.");
  } catch (e) { toast(e.message || "Could not save.", "error"); }
}
/** The extension's "Back to the dashboard" link carries ?sent=<id>: record it, then clean the address. */
function recordSentFromLink() {
  var id = new URLSearchParams(location.search).get("sent");
  if (!id) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
  if (state.demo || !conn().token) return;
  guestSet(id, { status: "sent" });
}

/* ---------- Modal ---------- */
function openModal(html) {
  var root = $("#modal-root");
  root.innerHTML = '<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal card" role="dialog" aria-modal="true">' + html + "</div></div>";
  var f = $("button, a, input", root); if (f) f.focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; }
function openConnect() {
  var c = conn();
  openModal('<h2>Connection</h2><p class="muted">The token lets this page read and write <strong>this one repository</strong>. It is kept only in this browser.</p>' +
    '<form id="conn-form" style="margin-top:14px;display:grid;gap:12px"><div class="form-grid"><div><label class="field" for="c-owner">GitHub owner</label><input class="input" id="c-owner" value="' + esc(c.owner) + '"></div><div><label class="field" for="c-repo">Repository</label><input class="input" id="c-repo" value="' + esc(c.repo) + '"></div></div>' +
    '<div><label class="field" for="c-branch">Branch</label><input class="input" id="c-branch" value="' + esc(c.branch) + '"></div>' +
    '<div><label class="field" for="c-token">Access token</label><input class="input" id="c-token" type="password" autocomplete="off" placeholder="github_pat_…" value="' + esc(c.token) + '"><div class="hint">Create a fine-grained token limited to this repository with Contents: read and write, and Actions: read and write. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create one</a></div></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px"><button class="btn" type="submit">Save and load</button><button class="btn secondary" type="button" data-action="signout">Sign out</button><button class="btn quiet" type="button" data-action="close-modal">Cancel</button></div></form>');
}

/* ---------- Events ---------- */
document.addEventListener("click", async function (ev) {
  var t = ev.target.closest("[data-action]"); if (!t) return;
  var a = t.dataset.action, id = t.dataset.site;
  if (a === "open-connect") return openConnect();
  if (a === "close-modal" || (a === "close-modal-bg" && ev.target === t)) return closeModal();
  if (a === "signout") { localStorage.removeItem(LS_CONN); closeModal(); state.data = null; state.settings = null; render(); return toast("Signed out. The token was removed from this browser."); }
  if (a === "copy") { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Copied " + t.dataset.copy); } catch (e) { toast("Copy failed. Select the name and copy it by hand.", "error"); } return; }
  if (a === "g-tab") { state.guest.tab[t.dataset.site] = t.dataset.status; state.guest.shown[t.dataset.site] = 12; return renderGuests(); }
  if (a === "g-more") { state.guest.shown[t.dataset.site] = (state.guest.shown[t.dataset.site] || 12) + 12; return renderGuests(); }
  if (a === "g-sent") return guestSet(t.dataset.g, { status: "sent" });
  if (a === "g-copy") {
    var gi = guestList().filter(function (x) { return x.id === t.dataset.g; })[0], gp = gi && guestPayload(gi.link), gf = gp && gp.fields[Number(t.dataset.i)];
    if (!gf) return;
    try { await navigator.clipboard.writeText(String(gf.value)); toast("Copied."); } catch (e) { toast("Copy failed. Select the text and copy it by hand.", "error"); }
    return;
  }
  if (a === "g-publish") { var urlBox = document.getElementById("g-url-" + t.dataset.g); return guestSet(t.dataset.g, { status: "published", published_url: urlBox ? urlBox.value.trim() : "" }); }
  if (a === "mode") { edit(id, { mode: t.dataset.mode }); return; }
  if (a === "reset") { delete state.edits[id]; return renderEdits(); }
  if (a === "clear-errors") { showErrors({}); return; }
  if (a === "save") {
    t.disabled = true;
    try { if (state.demo) { toast("Demo mode: nothing was saved."); t.disabled = false; return; } await saveSettings(id, state.edits[id] || {}); delete state.edits[id]; toast("Saved. It applies from the next run."); await load(); }
    catch (e) { toast("Could not save: " + e.message, "error"); t.disabled = false; }
  }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (!t.dataset || !t.dataset.site) return;
  if (t.dataset.field === "articles_per_day") edit(t.dataset.site, { articles_per_day: Number(t.value) });
  if (t.dataset.field === "enabled") edit(t.dataset.site, { enabled: t.checked });
});
document.addEventListener("submit", async function (ev) {
  if (ev.target.id === "add-form") return submitAdd(ev);
  if (ev.target.id === "conn-form") {
    ev.preventDefault();
    var c = { owner: $("#c-owner").value.trim(), repo: $("#c-repo").value.trim(), branch: $("#c-branch").value.trim() || "main", token: $("#c-token").value.trim() };
    if (!c.owner || !c.repo || !c.token) return toast("Enter the owner, repository and token.", "error");
    localStorage.setItem(LS_CONN, JSON.stringify(c)); closeModal(); toast("Connection saved on this device."); load();
  }
});
document.addEventListener("input", function (ev) {
  if (ev.target.id === "f-name") { var idEl = $("#f-id"); if (idEl && !idEl.dataset.touched) idEl.value = slugify(ev.target.value); }
  if (ev.target.id === "f-id") ev.target.dataset.touched = "1";
  if (ev.target.id === "f-url") { var pg = $("#f-pages"); if (pg && !pg.value.trim() && /^https?:\/\/[^/]+\.[a-z]/i.test(ev.target.value)) pg.dataset.suggest = ev.target.value.replace(/\/+$/, "") + "/ | the homepage"; }
});
document.addEventListener("focusin", function (ev) { if (ev.target.id === "f-pages" && !ev.target.value.trim() && ev.target.dataset.suggest) ev.target.value = ev.target.dataset.suggest; });
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && $("#modal-root").firstChild) closeModal(); });
function edit(id, change) {
  var site = siteList().filter(function (s) { return s.id === id; })[0]; if (!site) return;
  var next = Object.assign({}, state.edits[id] || {}, change), saved = site.saved;
  Object.keys(next).forEach(function (k) { if (next[k] === saved[k] || (k === "enabled" && (saved.enabled !== false) === next.enabled)) delete next[k]; });
  state.edits[id] = next; renderEdits();
}
document.addEventListener("toggle", function (ev) { var d = ev.target; if (d && d.getAttribute && d.getAttribute("data-guest-site")) state.guest.open[d.getAttribute("data-guest-site")] = d.open; }, true);
document.addEventListener("input", function (ev) { var t = ev.target; if (t && typeof t.id === "string" && t.id.indexOf("g-url-") === 0) state.guest.urls[t.id.slice(6)] = t.value; });
$("#btn-connect").addEventListener("click", openConnect);
$("#btn-run").addEventListener("click", async function () {
  var b = this; b.disabled = true;
  try { await ghRun(); toast("A run was started. Results appear here in about 5 minutes."); setTimeout(load, 15000); } catch (e) { toast("Could not start a run: " + e.message, "error"); }
  b.disabled = false;
});
$("#btn-theme").addEventListener("click", function () {
  var order = ["auto", "light", "dark"], cur = document.documentElement.getAttribute("data-theme") || "auto", next = order[(order.indexOf(cur) + 1) % 3];
  document.documentElement.setAttribute("data-theme", next); localStorage.setItem(LS_THEME, next); this.textContent = "Theme: " + next[0].toUpperCase() + next.slice(1);
});

(function init() {
  var th = localStorage.getItem(LS_THEME) || "auto"; document.documentElement.setAttribute("data-theme", th); $("#btn-theme").textContent = "Theme: " + th[0].toUpperCase() + th.slice(1);
  state.demo = /[?&]demo=1\b/.test(location.search); load();
  setInterval(function () { if (!state.demo && conn().token && !document.hidden && !Object.keys(state.edits).length) load(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
